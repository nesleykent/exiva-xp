<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Home-screen icon source: the wordmark glyph on the dark surface.
       iOS fills transparency with black, so the background is baked in;
       the 20% padding keeps it safe under maskable/squircle crops.
       PNGs are generated with: qlmanage -t -s 512 (and 180) -o . icon.svg -->
  <defs><linearGradient id="xg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFD600"/><stop offset="35%" stop-color="#FF0169"/><stop offset="100%" stop-color="#7638FA"/>
  </linearGradient></defs>
  <rect width="64" height="64" fill="#0c1014"/>
  <rect x="18" y="18" width="28" height="28" rx="9" fill="none" stroke="url(#xg)" stroke-width="2.6"/>
  <path d="M26 37.5 32 25l6 12.5" fill="none" stroke="url(#xg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="33.2" r="1.6" fill="url(#xg)"/>
</svg>
