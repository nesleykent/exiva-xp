# Daily Night'Flyn tracker — same mechanism and schedule as
# github.com/mathiasbynens/tibia-xp-history: the Tibia highscores roll once
# a day, and the script keys history rows by Tibia's 10:00 Europe/Berlin
# server-save boundary. A daily crawl at 03:00 UTC records {rank, level,
# experience} plus the skill categories, committed back to the repo with the
# owner's GitHub noreply identity so the contributor list stays owner-only.
# The data commit then dispatches publish.yml so the site redeploys with
# fresh numbers (a GITHUB_TOKEN push does not fire push-triggered
# workflows on its own).
name: Track character

on:
  schedule:
    # Reference project: "During CEST, run daily at 03:00 UTC".
    - cron: '00 03 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: track-character
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch today's highscore + profile data
        id: character
        run: node pipeline/track-character.mjs

      - name: Commit the day's data
        uses: ./.github/actions/commit-generated-data
        with:
          paths: |
            data/character-history.json
            data/character.json
            data/character-snapshot.json
          message: ${{ steps.character.outputs.commit-message }}
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
