# TibiaData tracker for the character configured in config.ini. The script keys history rows by Tibia's
# 10:00 Europe/Berlin server-save boundary, and reruns during the same Tibia
# day refresh the current row when TibiaData reports fresher values. Each crawl
# records {rank, level, experience} plus the skill categories, committed back
# to the repo with the owner's GitHub noreply identity so the contributor list
# stays owner-only.
# The data commit then dispatches publish.yml so the site redeploys with
# fresh numbers (a GITHUB_TOKEN push does not fire push-triggered
# workflows on its own).
name: Track character

on:
  schedule:
    # A 15-minute cadence (4 crons/hour) was configured here, but GitHub
    # Actions' scheduler is well-documented to be unreliable at that
    # frequency under load — the same failure mode already forced removing
    # the separate online-presence tracker (see AGENTS.md). Run history
    # confirmed it: real gaps between runs were routinely 1-3 hours, not
    # 15 minutes. One honest hourly cron (off :00, GitHub's busiest slot)
    # is what this schedule can actually deliver.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: track-character
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch today's highscore + profile data
        id: character
        run: node pipeline/track-character.mjs

      - name: Commit the day's data
        uses: ./.github/actions/commit-generated-data
        with:
          paths: |
            data/character-history.json
            data/character.json
            data/character-snapshot.json
          message: ${{ steps.character.outputs.commit-message }}
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
