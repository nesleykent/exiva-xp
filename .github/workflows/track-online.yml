# 15-minute online sampler for Night'Flyn. It uses TibiaData's world
# endpoint, which exposes the current online_players list for a world.
name: Track online samples

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: track-online
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch online sample
        id: sample
        run: node pipeline/track-online.mjs

      # The sampler emits deploy=true only when the new state is worth showing
      # promptly; plain offline heartbeats commit without deploying.
      - name: Commit sampled data
        uses: ./.github/actions/commit-generated-data
        with:
          paths: |
            data/character-online.json
          message: ${{ steps.sample.outputs.commit-message }}
          publish: ${{ steps.sample.outputs.deploy }}
          token: ${{ secrets.GITHUB_TOKEN }}
