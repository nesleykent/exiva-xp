name: Check shared hunt

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'hunt')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Judge the payload
        id: judge
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node pipeline/check-hunt.mjs

      - name: Post verdict
        uses: actions/github-script@v9
        env:
          COMMENT: ${{ steps.judge.outputs.comment }}
          VERDICT: ${{ steps.judge.outputs.verdict }}
        with:
          script: |
            const { COMMENT, VERDICT } = process.env;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              ...context.repo, issue_number, body: COMMENT || 'The check produced no output.',
            });
            const clean = VERDICT === 'clean';
            await github.rest.issues.addLabels({
              ...context.repo, issue_number, labels: [clean ? 'clean' : 'faulted'],
            });
            if (!clean) {
              await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed' });
            }
