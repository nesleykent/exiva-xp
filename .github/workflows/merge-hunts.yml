name: Merge shared hunts

on:
  issues:
    types: [labeled]
  schedule:
    - cron: '43 4 * * *'   # nightly sweep
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: merge-hunts
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'issues' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Merge and rebuild the ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node pipeline/merge-hunts.mjs

      - name: Commit datasets
        uses: ./.github/actions/commit-generated-data
        with:
          paths: |
            data/shared-hunts.json
            data/ledger.json
          message: 'data: merge shared hunts'
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
